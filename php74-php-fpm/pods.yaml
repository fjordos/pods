---
apiVersion: v1
kind: Pod
metadata:
  labels:
    app: php74-pod
  name: php74-pod
spec:
  hostname: exmpple.com
  containers:
  - image: ghcr.io/fjordos/simple/php74-php-fpm:latest
    name: php
   #readinessProbe:
   #  exec:
   #  command:
   #  - /bin/ls
   #  - /run/php-fpm/www.sock
   #  initialDelaySeconds: 5
   #  periodSeconds: 15
   #  failureThreshold: 2
   #  successThreshold: 1
   #livenessProbe:
   #  exec:
   #  command:
   #  - sh
   #  - -c
   #  - "/sbin/ss -tnlp | grep '0.0.0.0:80'"
   #  initialDelaySeconds: 30
   #  periodSeconds: 15
   #  failureThreshold: 2
   #  successThreshold: 1
    restartPolicy: Always
    securityContext: {}
    volumeMounts:
    - name: docroot
      mountPath: /var/www/html
    - name: socket
      mountPath: /run/php-fpm
    - name: var-lib-php
      mountPath: /var/lib/php
#    - name: php-fpm-config
#      mountPath: /etc/php-fpm.d/www.conf
#      readOnly: true
  volumes:
  - name: docroot
    hostPath:
      path: example.com/public_html
      type: Directory
  - name: socket
    hostPath:
      path: example.com/socket
      type: Directory
  - name: var-lib-php
    persistentVolumeClaim:
      claimName: var-lib-php-example.com
#  - name: php-fpm-config
#    hostPath:
#      path: www.conf
#      type: File
